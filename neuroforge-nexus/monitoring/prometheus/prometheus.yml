global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: neuroforge-nexus
    metrics_path: /actuator/prometheus
    static_configs:
      # For a backend running directly on the host. If backend is containerized,
      # use its Compose service name and internal port instead.
      - targets: ["host.docker.internal:8080"]
